<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 768" role="img" aria-label="Gestión de grupos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="1" stop-color="#ffeedd"/>
    </linearGradient>
  </defs>
  <rect width="2048" height="768" fill="url(#bg)"/>
  <circle cx="1730" cy="120" r="210" fill="#fff6d6" opacity=".8"/>
  <circle cx="260" cy="700" r="260" fill="#d9ecff" opacity=".7"/>
  <text x="110" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#2f3b66">Gestión</text>
  <text x="110" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#2f3b66">de grupos</text>
  <text x="116" y="580" font-family="system-ui, sans-serif" font-size="46" fill="#5a6590">Clases · equipos · excursiones · botes</text>
  <!-- grupo de personas -->
  <g transform="translate(1180 230)">
    <g fill="#7aa7ff"><circle cx="90" cy="70" r="58"/><path d="M-10 330 q0 -170 100 -170 t100 170z"/></g>
    <g fill="#ffb36b"><circle cx="300" cy="40" r="66"/><path d="M180 340 q0 -190 120 -190 t120 190z"/></g>
    <g fill="#8fd6a2"><circle cx="520" cy="70" r="58"/><path d="M420 330 q0 -170 100 -170 t100 170z"/></g>
  </g>
  <!-- bote con monedas -->
  <g transform="translate(1560 470)">
    <ellipse cx="120" cy="190" rx="130" ry="26" fill="#2f3b66" opacity=".15"/>
    <rect x="20" y="40" width="200" height="150" rx="30" fill="#ffd166"/>
    <rect x="10" y="20" width="220" height="40" rx="18" fill="#f4b73a"/>
    <circle cx="120" cy="-10" r="34" fill="#ffe08a" stroke="#f4b73a" stroke-width="8"/>
    <text x="120" y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#b8860b">€</text>
    <text x="120" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="#b8860b">€</text>
  </g>
</svg>
