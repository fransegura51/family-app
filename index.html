<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4C6EF5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <title>Family App</title>
    <!-- Vista previa al compartir un enlace de la app (p. ej. la lista de deseos «?deseos=...»): marca y descripción genéricas, nada privado. -->
    <meta name="description" content="PEPA Family App: la app para organizar la vida en familia." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PEPA Family App" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="PEPA Family App" />
    <meta property="og:description" content="Calendario, compras, tareas y más para organizar la vida en familia." />
    <meta property="og:image" content="https://fransegura51.github.io/family-app/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Contraparte del 404.html: descodifica la ruta real antes de que
      React Router (o cualquier código) lea window.location. Tiene que
      ejecutarse ANTES del bundle principal.
    -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
