name: Android APK

# Fabrica el archivo de instalación (APK) de la app de Android de PEPA. Se lanza a mano (Actions → Android APK → Run workflow); no toca el
# despliegue de la web. La app es una cáscara que abre la PEPA publicada (ver capacitor.config.ts), así que solo hace falta una APK nueva
# cuando cambia algo NATIVO (permisos, ubicación en segundo plano, icono…). La llave de firma vive en los secretos del repositorio
# (ANDROID_KEYSTORE_B64 y compañía), nunca en el código: el repositorio es público.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El complemento de dictado cierra la app entera en móviles donde el servicio de voz no se deja enlazar (Xiaomi): se parchea. El script
      # también corre solo tras «npm ci» (postinstall); aquí se llama a propósito para que el APK nunca se construya sin el parche.
      - name: Parchear el complemento de dictado por voz
        run: node scripts/patch-speech-plugin.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Los servidores de GitHub ya traen el SDK de Android; solo hay que aceptar sus licencias para que Gradle descargue lo que falte.
      - name: Aceptar licencias del SDK de Android
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      # Avisos nativos (Firebase): el archivo google-services.json va como secreto del repositorio (GOOGLE_SERVICES_JSON_B64), nunca en el código.
      # Sin él la app se construye igual, pero no recibe avisos nativos.
      - name: Preparar Firebase (si está configurado)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "Firebase configurado"
          else
            echo "Sin Firebase: esta app no recibirá avisos nativos"
          fi
      - name: Sincronizar el proyecto de Android
        run: npx cap sync android
      - name: Preparar la llave de firma
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pepa-android.p12"
      - name: Compilar el APK firmado
        working-directory: android
        env:
          PEPA_KEYSTORE_PATH: ${{ runner.temp }}/pepa-android.p12
          PEPA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEPA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEPA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PpepaVersionCode=${{ github.run_number }} -PpepaVersionName=1.0.${{ github.run_number }}
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk PEPA-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PEPA-android
          path: PEPA-android.apk
          if-no-files-found: error
