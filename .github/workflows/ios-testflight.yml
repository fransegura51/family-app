name: iOS TestFlight

# Firma la app de iPhone y la sube a TestFlight desde un Mac de GitHub, sin Mac propio. Se lanza a mano (Actions → iOS TestFlight → Run workflow).
# SIN PROBAR hasta que la cuenta de Apple Developer (titular: Paco) esté activa y se hayan creado los secretos de abajo: es un borrador preparado.
# Pasos y explicación para tontos: docs/APP_IOS.md. El repositorio es público: NADA secreto en el código, todo en Settings → Secrets and variables → Actions.
#
# Secretos que necesita (todos salen de la web de Apple o de Firebase; se pegan en GitHub, nunca en el chat ni en el código):
#   APPLE_TEAM_ID              Identificador del equipo (10 caracteres, en developer.apple.com → Membership details).
#   ASC_KEY_ID                 ID de la llave de la API de App Store Connect (rol «Admin», para que Apple cree y gestione los certificados de firma).
#   ASC_ISSUER_ID              Issuer ID de esa misma pantalla (App Store Connect → Usuarios y acceso → Integraciones → App Store Connect API).
#   ASC_KEY_P8_B64             El archivo .p8 de esa llave, en base64 (Apple solo deja descargarlo UNA vez).
#   GOOGLE_SERVICE_INFO_PLIST_B64  GoogleService-Info.plist de la app de iPhone en Firebase (proyecto pepa-d9315), en base64.
# La firma es automática en la nube de Apple (certificado de distribución y perfil se crean solos con la llave de la API).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    steps:
      # Apple exige compilar con el SDK de iOS 26 (Xcode 26 o posterior) para subir a App Store Connect.
      - name: Elegir Xcode 26
        run: |
          X="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sincronizar el proyecto de iPhone
        run: npx cap sync ios
      - name: Instalar las piezas nativas (CocoaPods)
        working-directory: ios/App
        run: pod install

      # Firebase (avisos): el archivo de configuración se escribe aquí y se añade al proyecto SOLO en esta construcción.
      - name: Añadir GoogleService-Info.plist
        working-directory: ios/App
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST_B64" || { echo "Falta el secreto GOOGLE_SERVICE_INFO_PLIST_B64"; exit 1; }
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > App/GoogleService-Info.plist
          sudo gem install xcodeproj --no-document
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            group = project.main_group.find_subpath("App", true)
            ref = group.new_file("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(ref)
            project.save'

      # Firma con el certificado Apple Distribution y el perfil App Store de PEPA, creados una vez con la API de App Store Connect
      # y guardados como secretos (IOS_DIST_CERT_P12_B64, IOS_DIST_CERT_PASSWORD, IOS_APPSTORE_PROFILE_B64, IOS_APPSTORE_PROFILE_NAME).
      # La firma automática en la nube (xcodebuild con la llave de la API) falla con «Cannot verify client's JWT headers», por eso es manual.
      - name: Instalar certificado y perfil de distribución
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_B64 }}
        run: |
          set -e
          test -n "$IOS_DIST_CERT_P12_B64" && test -n "$IOS_APPSTORE_PROFILE_B64" || { echo "Faltan los secretos de firma"; exit 1; }
          KC="$RUNNER_TEMP/firma.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "Largo de la contraseña del .p12: $(printf '%s' "$IOS_DIST_CERT_PASSWORD" | wc -c | tr -d ' ') ; tamaño del .p12: $(wc -c < "$RUNNER_TEMP/dist.p12" | tr -d ' ') bytes"
          if P12CHECK="$IOS_DIST_CERT_PASSWORD" openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:P12CHECK -noout 2>&1; then echo "openssl abre el .p12 con esa contraseña"; else echo "openssl NO abre el .p12 con esa contraseña"; fi
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APPSTORE_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Perfil instalado: $(security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" | plutil -extract Name raw -)"
          security find-identity -v -p codesigning "$KC"

      # Se archiva SIN firmar y se firma al exportar con el certificado de distribución (así también quedan firmados los frameworks de Firebase).
      - name: Crear el archivo (archive)
        working-directory: ios/App
        run: |
          set -o pipefail
          # El número de compilación tiene que subir en cada envío a TestFlight: se usa el número de ejecución de GitHub.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PEPA.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -40

      - name: Firmar, exportar y subir a TestFlight
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_APPSTORE_PROFILE_NAME: ${{ secrets.IOS_APPSTORE_PROFILE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD" || { echo "Faltan los secretos APPLE_ID / APPLE_APP_PASSWORD"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>es.pepafamilyapp.app</key><string>${IOS_APPSTORE_PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PEPA.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tail -40
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          test -f "$IPA" || { echo "No se generó el .ipa"; exit 1; }
          # Subida con el Apple ID de Paco y una contraseña de aplicación (la subida con la llave de la API da «Cannot verify client's JWT headers»).
          xcrun altool --upload-app --type ios --file "$IPA" --username "$APPLE_ID" --password "$APPLE_APP_PASSWORD"
