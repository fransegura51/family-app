<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Volver a PEPA</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf8f3; color: #1b2433; text-align: center; padding: 24px; }
    main { max-width: 420px; }
    h1 { font-size: 1.5rem; }
    .big { display: block; padding: 18px; border-radius: 14px; background: #12a594; color: #fff; font-size: 1.2rem; font-weight: 700; text-decoration: none; margin: 22px 0 14px; }
    a.small { color: #5b6b82; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>¡Listo!</h1>
    <p>Ya puedes volver a PEPA.</p>
    <a id="app" class="big" href="#">Volver a PEPA</a>
    <a id="web" class="small" href="#">Abrir en el navegador</a>
  </main>
  <script>
    // Página puente: Google y el banco terminan aquí (la dirección de vuelta que aceptan es de la web) y desde aquí se abre la app con su enlace propio.
    // El parámetro «to» es una ruta de PEPA («/calendario?google=connected»); solo se aceptan rutas que empiecen por «/».
    var BASE = 'https://fransegura51.github.io/family-app'
    var to = new URLSearchParams(location.search).get('to') || '/'
    if (to.charAt(0) !== '/' || to.charAt(1) === '/' || /^\/[a-z][a-z0-9+.-]*:/i.test(to)) to = '/'
    var appUrl = 'es.pepafamilyapp.app://open' + to
    document.getElementById('app').href = appUrl
    document.getElementById('web').href = BASE + to
    // Intento automático; si el navegador lo bloquea, queda el botón.
    setTimeout(function () { location.href = appUrl }, 400)
  </script>
</body>
</html>
